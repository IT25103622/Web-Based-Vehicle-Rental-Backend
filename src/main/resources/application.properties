# ============================================
# Access Control Module - Application Config
# ============================================

server.port=8080
spring.application.name=access-control-module

# ---------- MySQL (via XAMPP / MySQL Workbench) ----------
# Create the schema first: run database/schema.sql in MySQL Workbench,
# or point Hibernate at an empty schema and let ddl-auto build it.
spring.datasource.url=jdbc:mysql://localhost:3306/vehicle_rental_db?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=CHASE@hrm123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ---------- JWT ----------
# Generate your own 256-bit secret for real use, e.g.: openssl rand -base64 32
app.jwt.secret=B+e8/TyQHlNABAAfPajR/DvulolZfEWKLqHbr6ABayU=
app.jwt.expiration-ms=3600000
# default session inactivity timeout the Admin can override at runtime (ms)
app.jwt.default-session-timeout-ms=1800000

# ---------- Mail (for MFA OTP emails) ----------
# Example uses Gmail SMTP with an App Password. Swap for your own provider.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=chathushawidanage@gmail.com
spring.mail.password=uszd yngv amhm ukew
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mfa.otp-expiry-minutes=5
app.mfa.otp-length=6

# ---------- Backups ----------
# Path to mysqldump.exe if not on PATH (typical XAMPP location on Windows,
# adjust for your machine), e.g.: C:/xampp/mysql/bin/mysqldump.exe
app.backup.mysqldump-path=mysqldump
app.backup.output-dir=./backups
app.backup.cron=0 0 2 * * *
app.backup.db-name=vehicle_rental_db
app.backup.db-user=root
app.backup.db-password=CHASE@hrm123

# ---------- CORS ----------
app.cors.allowed-origins=http://localhost:5173

logging.level.com.sliit.vehiclerental.accesscontrol=DEBUG
