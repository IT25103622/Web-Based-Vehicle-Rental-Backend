server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: vehicle-rental-uc02
  datasource:
    # MySQL connection string for the shared Vehicle Rental database
    url: ${DB_URL:jdbc:mysql://localhost:3306/vehicle_rental_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root1234}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  sql:
    init:
      mode: never

# JWT Configuration (Shares identical secret configuration with Friend_Project)
app:
  jwt:
    secret: ${APP_JWT_SECRET:B+e8/TyQHlNABAAfPajR/DvulolZfEWKLqHbr6ABayU=}
    expiration-ms: ${APP_JWT_EXPIRATION_MS:3600000}

# Logging configuration
logging:
  level:
    com.sliit.vehiclerental: INFO
    org.hibernate.SQL: WARN
